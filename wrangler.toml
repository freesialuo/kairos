name = "kairos"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[build]
command = "node scripts/build-worker.mjs"

[assets]
directory = "crates/kairos-web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/auth/*"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[triggers]
crons = ["0 */6 * * *"]

[vars]
RP_ID = "CHANGE-ME"
ORIGIN = "https://CHANGE-ME"

[secrets]
required = ["RECOVERY_CODE", "SESSION_SECRET"]

[env.e2e]
build = { command = "cargo install -q --locked --version 0.9.0 worker-build && worker-build --dev --panic-unwind --out-dir ../../build/e2e crates/kairos-worker --features test-hooks" }
assets = { directory = "crates/kairos-web/dist", not_found_handling = "single-page-application", run_worker_first = ["/api/*", "/auth/*", "/__test/*"] }
main = "build/e2e/worker/shim.mjs"
vars = { RP_ID = "localhost", ORIGIN = "http://localhost:8799" }

[[env.e2e.durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[env.e2e.migrations]]
tag = "v1"
new_sqlite_classes = ["Hub"]

[env.e2e.triggers]
crons = ["0 */6 * * *"]
