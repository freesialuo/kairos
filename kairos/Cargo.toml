[workspace]
members = ["crates/kairos-types", "crates/kairos-core", "crates/kairos-testkit", "crates/kairos-worker", "crates/e2e", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
disallowed_methods = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true

# wasm-bindgen needs the Wasm feature and stack metadata to wire panic recovery.
[profile.release.package.kairos-worker]
strip = "debuginfo"
# LLVM Wasm exception lowering needs reduced optimization for the alarm future.
opt-level = 1
