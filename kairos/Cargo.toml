[workspace]
members = ["crates/kairos-types", "crates/kairos-core", "crates/kairos-testkit", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
disallowed_methods = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
