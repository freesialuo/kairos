[package]
name = "kairos-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std"] }
kairos-types = { path = "../kairos-types" }
serde_json = "1"
base64 = "0.22"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window","Document","Element","Location","Navigator","CredentialsContainer","Credential","PublicKeyCredential","PublicKeyCredentialCreationOptions","PublicKeyCredentialRequestOptions","AuthenticatorResponse","AuthenticatorAttestationResponse","AuthenticatorAssertionResponse","CredentialCreationOptions","CredentialRequestOptions","FormData","HtmlFormElement","HtmlInputElement","UrlSearchParams","History","Event","SubmitEvent","Storage","HtmlSelectElement"] }
