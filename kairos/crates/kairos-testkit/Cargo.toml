[package]
name = "kairos-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kairos-core = { path = "../kairos-core" }
jiff = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
form_urlencoded = "1"

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
