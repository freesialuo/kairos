[package]
name = "kairos-testkit"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
kairos-core = { path = "../kairos-core" }
jiff = "0.2"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_json = "1"
sha2 = { version = "0.11.1", default-features = false }
form_urlencoded = "1"
kairos-types = { version = "0.1.0", path = "../kairos-types" }
ciborium = { version = "0.2.2", default-features = false, features = ["std"] }
p256 = { version = "0.14.0", features = ["ecdsa"], default-features = false }
ed25519-dalek = { version = "3.0.0", features = ["signature"], default-features = false }
rsa = { version = "0.10.0", features = ["pkcs1v15"], default-features = false }
chacha20 = { version = "0.10.2", features = ["rng"], default-features = false }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt"] }
proptest = "1"

[lints]
